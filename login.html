
<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NS Event</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        h2 {
            text-align: center;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>NS Freshman Welcome Event</h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            ເຂົ້າສູ່ລະບົບ
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://pkqksekvxvklwhotnfzf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cgNW2DK1gzwejrOuhiiNQA_4DMFaQ-a";
    const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
    const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = loginForm.querySelector("button");
    button.disabled = true;
    button.textContent = "ກຳລັງກວດສອບ...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) throw error;

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("role, is_active")
                .eq("id", data.user.id)
                .maybeSingle();

        if (profileError) throw profileError;

        if (
            !profile ||
            profile.role !== "admin" ||
            profile.is_active !== true
        ) {
            await supabaseClient.auth.signOut();
            throw new Error("ບັນຊີນີ້ບໍ່ມີສິດ Admin");
        }

        message.textContent = "Login ສຳເລັດ! ກຳລັງເຂົ້າລະບົບ...";
        message.style.color = "green";

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";

    } finally {
        button.disabled = false;
        button.textContent = "ເຂົ້າສູ່ລະບົບ";
    }
});
</script>

</body>
</html>
